<!doctype html><html><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=1280,height=720"><title>Rysh</title>
<style>
:root{--bg:#0b1020;--panel:#141b2f;--line:#26304d;--text:#eef2ff;--dim:#94a3b8;--accent:#60a5fa}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
body{display:grid;grid-template-rows:88px 1fr auto auto;height:100vh;padding:0 56px}
body[data-state=listening]{--accent:#34d399}
body[data-state=heard]{--accent:#22d3ee}
body[data-state=thinking],body[data-state=working]{--accent:#a78bfa}
body[data-state=preparing_speech]{--accent:#f472b6}
body[data-state=speaking]{--accent:#fbbf24}
body[data-state=awaiting_approval],body[data-state=awaiting_speech]{--accent:#fb923c}
body[data-state=error],body[data-state=disconnected],body[data-state=playback_failed]{--accent:#f87171}
body[data-state=paused],body[data-state=ended],body[data-state=connecting],body[data-state=joining]{--accent:#94a3b8}
header{display:flex;align-items:center;justify-content:space-between;border-bottom:2px solid var(--line)}
.brand{font-size:44px;font-weight:800;letter-spacing:-1px}
.badge{font-size:24px;font-weight:700;padding:8px 20px;border-radius:999px;border:2px solid var(--accent);color:var(--accent)}
main{display:flex;align-items:center;gap:56px;min-height:0}
.orb{flex:none;width:200px;height:200px;border-radius:50%;position:relative;background:var(--accent);background:radial-gradient(circle at 35% 35%,color-mix(in srgb,var(--accent) 80%,white),var(--accent) 60%,color-mix(in srgb,var(--accent) 40%,black));box-shadow:0 0 80px color-mix(in srgb,var(--accent) 45%,transparent)}
.orb::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:6px solid var(--accent);opacity:0}
body[data-state=listening] .orb::after,body[data-state=heard] .orb::after{animation:ring 1.8s ease-out infinite}
body[data-state=thinking] .orb,body[data-state=working] .orb,body[data-state=preparing_speech] .orb,body[data-state=joining] .orb,body[data-state=connecting] .orb{animation:breathe 1.2s ease-in-out infinite alternate}
body[data-state=speaking] .orb{animation:talk .45s ease-in-out infinite alternate}
@keyframes ring{from{transform:scale(.9);opacity:.9}to{transform:scale(1.25);opacity:0}}
@keyframes breathe{from{transform:scale(.92);opacity:.75}to{transform:scale(1.04);opacity:1}}
@keyframes talk{from{transform:scale(.97)}to{transform:scale(1.06)}}
.status{min-width:0;flex:1}
#state{font-size:84px;font-weight:800;line-height:1.05;letter-spacing:-2px;margin:0}
#detail{font-size:34px;color:var(--dim);margin:14px 0 0;min-height:42px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.turn{margin-top:28px;padding:22px 28px;background:var(--panel);border-left:8px solid var(--accent);border-radius:14px}
.turn[hidden],#caption[hidden]{display:none}
.who{display:flex;justify-content:space-between;font-size:26px;color:var(--dim)}
#speaker{color:var(--text);font-weight:700}
#elapsed{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
#request{font-size:34px;margin:10px 0 0;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
#caption{font-size:38px;line-height:1.3;font-weight:600;text-align:center;background:rgba(0,0,0,.55);border-radius:14px;padding:16px 28px;margin-bottom:12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
footer{display:flex;align-items:center;justify-content:center;text-align:center;padding:16px 0 20px;font-size:19px;color:var(--dim);border-top:2px solid var(--line)}
</style></head>
<body data-state="connecting">
<header><div class="brand" id="brand">Rysh</div><div class="badge">AI assistant</div></header>
<main><div class="orb" aria-hidden="true"></div><div class="status">
 <h1 id="state">Connecting</h1><p id="detail"></p>
 <div class="turn" id="turn" hidden><div class="who"><span>Answering <span id="speaker"></span></span><span id="elapsed">0:00</span></div><p id="request"></p></div>
</div></main>
<div id="caption" hidden></div>
<footer><span>AI-generated voice · Speech is processed by Recall.ai and AI providers · No recording retention · Answers only allowed participants (names are not verified) · Say “rysh stop” to interrupt</span></footer>
<script>
'use strict';
const token=location.hash.slice(1);history.replaceState(null,'',location.pathname);
const el=id=>document.getElementById(id);
const brand=el('brand'),state=el('state'),detail=el('detail'),turnBox=el('turn'),speaker=el('speaker'),request=el('request'),elapsed=el('elapsed'),caption=el('caption');
const url=new URL(location.href);url.protocol='wss:';url.pathname=url.pathname.replace(/^\/api\/meeting-bot\//,'/ws/meeting-bot/').replace(/\/media$/,'/socket');url.hash='';
// One page, two servers: this file is byte-identical in rysh-cli
// (internal/meeting) and rysh-server (internal/meetingbot); edit both (design 040).
// Wall phases: the names Phase() returns in each repo.
const LABELS={
 connecting:['Connecting',''],joining:['Joining the meeting',''],
 listening:['Listening','Say “hey rysh” and ask a question'],
 heard:['Hearing your request',''],
 awaiting_approval:['Waiting for approval','The operator reviews each request'],
 thinking:['Thinking','Working on your request'],working:['Working',''],
 awaiting_speech:['Answer ready','Waiting for the operator'],
 preparing_speech:['Preparing the answer','Turning the reply into speech'],
 speaking:['Speaking',''],
 error:['Couldn’t complete that','Please ask again'],
 paused:['Paused','The assistant is not listening'],
 ended:['Left the meeting',''],
 disconnected:['Disconnected','Reconnecting…'],
 playback_failed:['Playback failed','The operator must resume'],
};
const TURN_STATES=new Set(['heard','awaiting_approval','thinking','working','awaiting_speech','preparing_talk','speaking','error']);
let socket,player,objectURL,turn,heartbeat,ticker,view={phase:'connecting'},turnStart=null,sentences=[];
const clock=()=>performance.now();
function sentencesOf(text){const parts=String(text).match(/[^.!?。]+[.!?。]*\s*/g)||[];return parts.map(s=>s.trim()).filter(Boolean);}
function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}
function render(){
 const s=LABELS[view.phase]?view.phase:'working',[label,hint]=LABELS[s];
 document.body.dataset.state=s;state.textContent=label;
 if(view.company)brand.textContent=view.company;
 const agent=view.agent?view.agent.charAt(0).toUpperCase()+view.agent.slice(1):'';
 detail.textContent=view.activity||(s==='error'&&view.error)||(s==='listening'?(view.allow==='host'?'Answering the host · say “hey '+(view.agent||'rysh')+'”':view.agent?'Say “hey '+view.agent+'” and ask a question':''):'')||(agent&&s==='thinking'?agent+' is working on it':'')||(agent&&s==='speaking'?agent+' is answering':'')||hint;
 const inTurn=TURN_STATES.has(s)&&!!(view.speaker||view.request);
 turnBox.hidden=!inTurn;
 speaker.textContent=view.speaker||'the meeting';request.textContent=view.request?'“'+view.request+'”':'';
 if(!inTurn)turnStart=null;
 sentences=s==='speaking'&&view.caption?sentencesOf(view.caption):[];
 tick();
}
function tick(){
 if(turnStart!==null)elapsed.textContent=fmt(clock()-turnStart);
 if(!sentences.length){caption.hidden=true;caption.textContent='';return;}
 // Pick the sentence matching playback progress, weighted by length.
 let i=0;
 if(player&&player.duration>0&&isFinite(player.duration)){
  const total=sentences.reduce((n,s)=>n+s.length,0),at=player.currentTime/player.duration*total;
  for(let n=0;i<sentences.length-1&&(n+=sentences[i].length)<=at;)i++;
 }
 caption.hidden=false;caption.textContent=sentences[i];
}
function show(next){
 view=next;
 if(typeof next.elapsed_ms==='number'&&TURN_STATES.has(next.phase))turnStart=clock()-next.elapsed_ms;
 render();
}
function local(phase){show({phase,company:view.company});}
function clear(){if(player){player.pause();player.removeAttribute('src');player.load();player=null;}if(objectURL){URL.revokeObjectURL(objectURL);objectURL=null;}turn=null;}
function send(value){if(socket.readyState===WebSocket.OPEN)socket.send(JSON.stringify(value));}
function connect(){socket=new WebSocket(url);socket.binaryType='arraybuffer';
 socket.onopen=()=>{send({token});local('listening');heartbeat=setInterval(()=>send({type:'ping'}),10000);};
 socket.onmessage=async e=>{
  if(typeof e.data==='string'){const m=JSON.parse(e.data);
   if(m.type==='status')show(m);
   else if(m.type==='clear'){clear();local('paused');}
   else if(m.type==='audio'){clear();turn=m.turn;if(view.phase!=='speaking'||m.caption)show(Object.assign({},view,{phase:'speaking'},m.caption?{caption:m.caption}:{}));}
   return;}
  if(!turn)return;const current=turn;objectURL=URL.createObjectURL(new Blob([e.data],{type:'audio/mpeg'}));player=new Audio(objectURL);
  player.onended=()=>{if(turn===current){send({type:'played',turn:current});clear();local('listening');}};
  try{await player.play();}catch{if(turn!==current)return;send({type:'playback_error',turn:current});clear();local('playback_failed');}
 };
 socket.onclose=()=>{clearInterval(heartbeat);clear();local('disconnected');setTimeout(connect,3000);};
 socket.onerror=()=>socket.close();
}
ticker=setInterval(tick,250);
render();
if(token)connect();else show({phase:'error',error:'Missing session capability'});
</script></body></html>
